site_name: Pizza Ontology
theme: readthedocs

# Add a page by putting it in docs/ and naming it here. Anything not listed
# is still published, but is reachable only by its URL.
nav:
  - Home: index.md
  - Editing: editing.md
  - Releases: release.md
  - Ontology documentation: ontology/index-en.html

# Widoco writes a readme.md beside the page it generates: its note to whoever
# publishes the page, not a page for readers.
exclude_docs: |
  ontology/readme.md
